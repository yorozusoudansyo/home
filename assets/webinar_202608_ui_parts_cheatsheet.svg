<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".10"/></filter>
    <style>
      text{font-family:"Noto Sans CJK JP","Yu Gothic UI","Meiryo",sans-serif;fill:#1f2937}
      .title{font-size:48px;font-weight:700}.sub{font-size:21px;fill:#4b5563}.section{font-size:28px;font-weight:700;fill:#fff}
      .name{font-size:23px;font-weight:700}.en{font-size:15px;fill:#d32f2f;font-weight:700}.desc{font-size:16px;fill:#4b5563}
      .label{font-size:14px;fill:#4b5563}.control{font-size:16px}.small{font-size:13px;fill:#6b7280}.button{font-size:16px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="1360" fill="#f9fafb"/>
  <rect x="0" y="0" width="18" height="1360" fill="#d32f2f"/>
  <text x="70" y="78" class="title">バイブコーディングのための UI部品 早見表</text>
  <text x="72" y="116" class="sub">名前を知れば、AIへの指示が具体的になる。 例：「入力欄の下にプルダウンを置いて、右下に実行ボタン」</text>

  <!-- headers -->
  <rect x="55" y="150" width="480" height="52" rx="12" fill="#d32f2f"/><text x="80" y="185" class="section">1. 入力する</text>
  <rect x="560" y="150" width="480" height="52" rx="12" fill="#1f2937"/><text x="585" y="185" class="section">2. 選択する</text>
  <rect x="1065" y="150" width="480" height="52" rx="12" fill="#334155"/><text x="1090" y="185" class="section">3. 操作・表示する</text>

  <!-- column 1 cards -->
  <g filter="url(#shadow)"><rect x="55" y="220" width="480" height="180" rx="16" fill="#fff"/></g>
  <text x="80" y="257" class="name">テキスト入力欄</text><text x="80" y="280" class="en">TEXT FIELD / INPUT</text>
  <text x="80" y="308" class="label">お名前</text><rect x="80" y="320" width="430" height="48" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="2"/><text x="96" y="351" class="control" fill="#9ca3af">例：山田 太郎</text>
  <text x="80" y="389" class="small">短い文字を1行で入力</text>

  <g filter="url(#shadow)"><rect x="55" y="418" width="480" height="202" rx="16" fill="#fff"/></g>
  <text x="80" y="455" class="name">複数行入力欄</text><text x="80" y="478" class="en">TEXTAREA</text>
  <text x="80" y="506" class="label">投稿内容</text><rect x="80" y="518" width="430" height="70" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="2"/><text x="96" y="546" class="control" fill="#9ca3af">文章を入力してください…</text>
  <text x="80" y="608" class="small">長い文章・プロンプト・メモの入力</text>

  <g filter="url(#shadow)"><rect x="55" y="638" width="480" height="164" rx="16" fill="#fff"/></g>
  <text x="80" y="675" class="name">検索ボックス</text><text x="80" y="698" class="en">SEARCH BOX</text>
  <rect x="80" y="716" width="430" height="48" rx="24" fill="#fff" stroke="#9ca3af" stroke-width="2"/><circle cx="105" cy="739" r="9" fill="none" stroke="#6b7280" stroke-width="2"/><line x1="112" y1="746" x2="120" y2="754" stroke="#6b7280" stroke-width="2"/><text x="134" y="746" class="control" fill="#9ca3af">キーワードで検索</text>
  <text x="80" y="789" class="small">一覧やデータの絞り込み</text>

  <g filter="url(#shadow)"><rect x="55" y="820" width="480" height="164" rx="16" fill="#fff"/></g>
  <text x="80" y="857" class="name">ファイル選択</text><text x="80" y="880" class="en">FILE UPLOAD</text>
  <rect x="80" y="899" width="135" height="46" rx="8" fill="#fff" stroke="#6b7280" stroke-width="2"/><text x="105" y="928" class="control">ファイルを選択</text><text x="232" y="928" class="small">未選択</text>
  <text x="80" y="973" class="small">画像・PDF・CSVなどを読み込む</text>

  <!-- column 2 -->
  <g filter="url(#shadow)"><rect x="560" y="220" width="480" height="180" rx="16" fill="#fff"/></g>
  <text x="585" y="257" class="name">プルダウン</text><text x="585" y="280" class="en">SELECT / DROPDOWN</text>
  <text x="585" y="308" class="label">画像スタイル</text><rect x="585" y="320" width="430" height="48" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="2"/><text x="601" y="351" class="control">アートポスター</text><path d="M982 339 l8 9 8-9" fill="none" stroke="#4b5563" stroke-width="2"/>
  <text x="585" y="389" class="small">候補から1つ選ぶ。項目が多い場合に便利</text>

  <g filter="url(#shadow)"><rect x="560" y="418" width="480" height="202" rx="16" fill="#fff"/></g>
  <text x="585" y="455" class="name">ラジオボタン</text><text x="585" y="478" class="en">RADIO BUTTON</text>
  <text x="585" y="510" class="label">画像比率（1つだけ選択）</text>
  <circle cx="597" cy="542" r="11" fill="#fff" stroke="#d32f2f" stroke-width="2"/><circle cx="597" cy="542" r="5" fill="#d32f2f"/><text x="618" y="548" class="control">1:1</text>
  <circle cx="688" cy="542" r="11" fill="#fff" stroke="#9ca3af" stroke-width="2"/><text x="709" y="548" class="control">16:9</text>
  <circle cx="803" cy="542" r="11" fill="#fff" stroke="#9ca3af" stroke-width="2"/><text x="824" y="548" class="control">4:5</text>
  <text x="585" y="608" class="small">複数候補のうち、必ず1つだけ選択</text>

  <g filter="url(#shadow)"><rect x="560" y="638" width="480" height="164" rx="16" fill="#fff"/></g>
  <text x="585" y="675" class="name">チェックボックス</text><text x="585" y="698" class="en">CHECKBOX</text>
  <rect x="585" y="721" width="21" height="21" rx="4" fill="#d32f2f"/><path d="M590 731 l5 5 8-10" fill="none" stroke="#fff" stroke-width="3"/><text x="617" y="739" class="control">見出しを入れる</text>
  <rect x="787" y="721" width="21" height="21" rx="4" fill="#fff" stroke="#9ca3af" stroke-width="2"/><text x="819" y="739" class="control">ロゴを入れる</text>
  <text x="585" y="789" class="small">0個以上を自由に複数選択</text>

  <g filter="url(#shadow)"><rect x="560" y="820" width="480" height="164" rx="16" fill="#fff"/></g>
  <text x="585" y="857" class="name">トグルスイッチ</text><text x="585" y="880" class="en">TOGGLE / SWITCH</text>
  <text x="585" y="921" class="control">自動保存</text><rect x="917" y="898" width="70" height="38" rx="19" fill="#d32f2f"/><circle cx="968" cy="917" r="15" fill="#fff"/><text x="585" y="973" class="small">ON / OFFを切り替える設定</text>

  <!-- column 3 -->
  <g filter="url(#shadow)"><rect x="1065" y="220" width="480" height="180" rx="16" fill="#fff"/></g>
  <text x="1090" y="257" class="name">ボタン</text><text x="1090" y="280" class="en">BUTTON</text>
  <rect x="1090" y="320" width="155" height="48" rx="9" fill="#d32f2f"/><text x="1122" y="351" class="button">画像を生成</text>
  <rect x="1260" y="320" width="120" height="48" rx="9" fill="#fff" stroke="#6b7280" stroke-width="2"/><text x="1289" y="351" class="control">キャンセル</text>
  <text x="1090" y="389" class="small">実行・保存・削除などのアクション</text>

  <g filter="url(#shadow)"><rect x="1065" y="418" width="480" height="202" rx="16" fill="#fff"/></g>
  <text x="1090" y="455" class="name">タブ</text><text x="1090" y="478" class="en">TABS</text>
  <rect x="1090" y="510" width="140" height="44" rx="8" fill="#1f2937"/><text x="1130" y="538" class="button">基本設定</text>
  <rect x="1230" y="510" width="140" height="44" rx="8" fill="#f3f4f6"/><text x="1270" y="538" class="control">詳細設定</text>
  <rect x="1370" y="510" width="140" height="44" rx="8" fill="#f3f4f6"/><text x="1410" y="538" class="control">プレビュー</text>
  <text x="1090" y="608" class="small">同じ画面内で内容を切り替える</text>

  <g filter="url(#shadow)"><rect x="1065" y="638" width="480" height="164" rx="16" fill="#fff"/></g>
  <text x="1090" y="675" class="name">モーダルダイアログ</text><text x="1090" y="698" class="en">MODAL DIALOG</text>
  <rect x="1090" y="714" width="430" height="58" rx="9" fill="#fff4f4" stroke="#d32f2f"/><text x="1110" y="739" class="control">本当に削除しますか？</text><rect x="1394" y="726" width="102" height="34" rx="7" fill="#d32f2f"/><text x="1425" y="749" font-size="14" font-weight="700" fill="#fff">削除</text>
  <text x="1090" y="789" class="small">確認や重要な入力を前面に表示</text>

  <g filter="url(#shadow)"><rect x="1065" y="820" width="480" height="164" rx="16" fill="#fff"/></g>
  <text x="1090" y="857" class="name">通知・メッセージ</text><text x="1090" y="880" class="en">ALERT / TOAST</text>
  <rect x="1090" y="899" width="430" height="49" rx="8" fill="#ecfdf5" stroke="#10b981"/><circle cx="1115" cy="923" r="10" fill="#10b981"/><path d="M1110 923 l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="1135" y="929" class="control">保存しました</text>
  <text x="1090" y="973" class="small">成功・警告・エラー・処理結果を知らせる</text>

  <!-- slider -->
  <g filter="url(#shadow)"><rect x="55" y="1018" width="1490" height="150" rx="16" fill="#fff"/></g>
  <text x="80" y="1055" class="name">スライダー</text><text x="80" y="1078" class="en">SLIDER / RANGE</text>
  <text x="340" y="1057" class="label">画像の明るさ</text>
  <text x="340" y="1115" class="small">0</text><line x1="375" y1="1108" x2="1250" y2="1108" stroke="#d1d5db" stroke-width="8" stroke-linecap="round"/>
  <line x1="375" y1="1108" x2="930" y2="1108" stroke="#d32f2f" stroke-width="8" stroke-linecap="round"/><circle cx="930" cy="1108" r="17" fill="#fff" stroke="#d32f2f" stroke-width="5"/>
  <rect x="1275" y="1084" width="95" height="48" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="2"/><text x="1300" y="1116" class="control">65%</text><text x="1390" y="1115" class="small">100</text>
  <text x="340" y="1150" class="small">つまみを動かして数値・強さを連続的に調整。現在値も表示すると分かりやすい</text>

  <!-- footer instruction -->
  <rect x="55" y="1200" width="1490" height="112" rx="16" fill="#1f2937"/>
  <text x="82" y="1234" font-size="20" font-weight="700" fill="#fff">AIへの指示例</text>
  <text x="82" y="1266" font-size="18" fill="#fff">「明るさを0〜100で調整できるスライダーを配置。現在値を右側に表示し、初期値は50にする。」</text>
  <text x="1515" y="1340" text-anchor="end" font-size="14" fill="#6b7280">UI COMPONENT CHEAT SHEET</text>
</svg>
