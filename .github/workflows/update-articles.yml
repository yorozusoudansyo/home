name: Update article cards from RSS

"on":
  schedule:
    # 21:00 UTC = 06:00 JST（毎日）
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run article update script
        run: python scripts/update_articles.py

      - name: Commit and push changes if any
        run: |
          if git diff --quiet -- data/articles.json; then
            echo "No changes to data/articles.json. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "chore: auto-update article cards from note/YouTube RSS"
          git push
