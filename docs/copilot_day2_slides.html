<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://yorozusoudansyo.pages.dev/copilot_day2_slides.html">
  <meta http-equiv="refresh" content="1;url=https://yorozusoudansyo.pages.dev/copilot_day2_slides.html">
  <title>公式サイトへ移動します | AI・ITよろず相談所</title>
  <script>
    const oldPath = window.location.pathname;
    const suffix = oldPath === '/home' ? '' : oldPath.startsWith('/home/') ? oldPath.slice('/home/'.length) : '';
    const target = new URL('https://yorozusoudansyo.pages.dev/');
    target.pathname = '/' + suffix;
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>
</head>
<body>
  <p>公式サイトへ移動しています。自動で移動しない場合は<a href="https://yorozusoudansyo.pages.dev/copilot_day2_slides.html">こちら</a>を開いてください。</p>
</body>
</html>
